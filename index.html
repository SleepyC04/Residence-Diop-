const setSy=x=>{const e=$("sy");if(e)e.textContent=x};
function wipe(){const l=S.cfg.lang;S=JSON.parse(DEF);S.cfg.lang=l}
async function afterAuth(){try{
 let ss=null;try{ss=(await sb.auth.getSession()).data.session}catch(e){}
 const cs={name:S.cloud.name,role:S.cloud.role,uid:S.cloud.uid};
 if(!navigator.onLine&&S.cloud.co&&S.cloud.uid&&(!ss||ss.user.id===S.cloud.uid)){SES=cs;return}
 if(!ss){SES=null;AUTHED=false;return}
 let m=null,er=false;try{const r=await sb.from("members").select("role,name,company_id,companies(name)").eq("user_id",ss.user.id).limit(1);er=!!r.error;m=r.data&&r.data[0]}catch(e){er=true}
 if(!m&&er&&S.cloud.co&&S.cloud.uid===ss.user.id){SES=cs;return}
 if(!m){AUTHED=true;SES=null;return}
 if(S.cloud.co&&S.cloud.co!==m.company_id)wipe();
 Object.assign(S.cloud,{co:m.company_id,coName:m.companies?m.companies.name:"",role:m.role,name:m.name,uid:ss.user.id});
 SES={name:m.name,role:m.role,uid:ss.user.id};AUTHED=false;ERR="";
 if(!S.cfg.till)S.cfg.till=String.fromCharCode(65+Math.random()*26|0)+String.fromCharCode(65+Math.random()*26|0);
 V="tabs";store();sync()}finally{BOOT=false}}
async function sync(){
 if(!sb||!S.cloud.co||SYN||!SES)return;
 if(!navigator.onLine){setSy("✈");return}
 SYN=true;setSy("☁ …");let ch=0;
 try{
  const co=S.cloud.co,ad=SES.role==="admin",h=S.cloud.h;let lp=S.cloud.lp||"1970-01-01T00:00:00Z";
  for(let pg=0;pg<20;pg++){
   const r=await sb.from("docs").select("kind,id,data,deleted,updated_at").eq("company_id",co).gte("updated_at",new Date(Date.parse(lp)-60000).toISOString()).order("updated_at").limit(1000);
   if(r.error)throw r.error;
   for(const d of r.data){const k=d.kind+"|"+d.id;
    if(d.kind==="cfg"&&d.data){if(h[k]===undefined||cj(cfgDoc())===h[k]){const n=cj(d.data);if(n!==cj(cfgDoc())){S.cfg=Object.assign({},S.cfg,d.data);ch++}h[k]=n}}
    else if(d.kind==="menu"&&d.data&&d.data.menu){if(h[k]===undefined||cj({menu:S.menu})===h[k]){const n=cj(d.data);if(n!==cj({menu:S.menu})){S.menu=d.data.menu;ch++}h[k]=n}}
    else if(d.kind==="tab"){const i=S.tabs.findIndex(x=>String(x.id)===d.id);
     if(d.deleted){if(i>=0){S.tabs.splice(i,1);ch++}delete h[k]}
     else if(d.data){const n=cj(d.data);if(i<0){if(h[k]===undefined){S.tabs.push(d.data);h[k]=n;ch++}}else if(h[k]===undefined||cj(S.tabs[i])===h[k]){if(n!==cj(S.tabs[i])){S.tabs[i]=d.data;ch++}h[k]=n}}}
    else if(d.kind==="rec"&&d.data){if(!S.rec.some(x=>x.no===d.id)){S.rec.push({...d.data,_s:1});ch++}}
   }
   if(r.data.length)lp=r.data[r.data.length-1].updated_at;
   if(r.data.length<1000)break}
  S.cloud.lp=lp;if(ch)S.rec.sort((a,b)=>a.ts<b.ts?1:-1);
  const up=[],add=(kind,id,d)=>{const j=cj(d),k=kind+"|"+id;if(h[k]!==j)up.push({row:{company_id:co,kind,id,data:d,deleted:false},k,j})};
  if(ad){add("cfg","cfg",cfgDoc());add("menu","menu",{menu:S.menu})}
  S.tabs.forEach(x=>add("tab",String(x.id),x));
  Object.keys(h).filter(k=>k.startsWith("tab|")&&!S.tabs.some(x=>"tab|"+x.id===k)).forEach(k=>up.push({row:{company_id:co,kind:"tab",id:k.slice(4),data:null,deleted:true},k,j:null}));
  if(up.length){const r=await sb.from("docs").upsert(up.map(u=>u.row),{onConflict:"company_id,kind,id"});if(r.error)throw r.error;up.forEach(u=>{if(u.j===null)delete h[u.k];else h[u.k]=u.j})}
  const nr=S.rec.filter(x=>!x._s);
  if(nr.length){const r=await sb.from("docs").upsert(nr.map(x=>({company_id:co,kind:"rec",id:x.no,data:x})),{onConflict:"company_id,kind,id",ignoreDuplicates:true});if(r.error)throw r.error;nr.forEach(x=>x._s=1)}
  store();setSy("☁ ✓")
 }catch(e){setSy("☁ !")}
 SYN=false;
 if(ch){const a=document.activeElement;if(!a||!/INPUT|SELECT/.test(a.tagName))R()}}
function R(){
 $("ttl").textContent=S.cfg.name;$("lg").textContent=S.cfg.lang==="fr"?"EN":"FR";$("prb").textContent=S.cfg.lang==="fr"?"Imprimer":"Print";$("clb").textContent=S.cfg.lang==="fr"?"Fermer":"Close";
 const ad=SES&&SES.role==="admin";if(V==="set"&&!ad)V="tabs";
 $("lo").textContent=SES?SES.name+" ⏻":"";$("lo").style.display=SES?"":"none";document.querySelector("nav").style.display=SES?"":"none";
 document.querySelectorAll("nav button").forEach(b=>{b.textContent=t(b.dataset.v);b.style.display=b.dataset.v==="set"&&!ad?"none":"";b.classList.toggle("on",b.dataset.v===V||(V==="tab"&&b.dataset.v==="tabs"))});
 $("app").innerHTML=!SES?vLogin():V==="tabs"?vTabs():V==="tab"?vTab():V==="rec"?vRec():vSet()}
function show(x){
 const h=x.hd,s=x.snap,lc=S.cfg.lang==="fr"?"fr-FR":"en-GB",d=new Date(x.ts);
 let o=`<div class="c"><div style="font-size:16px;font-weight:700">${esc(h.name)}</div>${esc(h.addr)}${h.nif?"<br>NIF : "+esc(h.nif):""}</div><hr><div class="c">${t("inv")}<div class="rn">N° ${x.no}</div></div><div class="row"><span>${d.toLocaleDateString(lc)}</span><span>${d.toLocaleTimeString(lc,{hour:"2-digit",minute:"2-digit"})}</span></div><div>${t(x.type)} ${esc(x.label)}</div>${x.guest?`<div>${t("guest")} : ${esc(x.guest)}</div>`:""}${x.by?`<div>${t("by")} : ${esc(x.by)}</div>`:""}<hr><table><tr><th>${t("qty")}</th><th>${t("item")}</th><th class="r">${t("amt")}</th></tr>`;
 s.ls.forEach(l=>o+=`<tr><td>${l.q}</td><td>${esc(l.n)}${s.on&&!l.tx?" *":""}</td><td class="r">${nn(l.base)}</td></tr>`);
 o+=`</table><hr><div class="row"><span>${t("ht")}</span><span>${nn(s.ht)}</span></div>`+(s.on?`<div class="row"><span>${t("tva")} ${s.rate}%</span><span>${nn(s.tva)}</span></div>`:"")+`<div class="net"><span>${t("net")}</span><span>${f(s.tot)}</span></div>`+x.pays.map(p=>`<div class="row"><span>${t(p.m)}</span><span>${nn(p.a)}</span></div>`).join("")+(s.on?`<div style="margin-top:6px">${t("notax")}</div>`:"")+`<hr><div class="c">${esc(h.foot)}</div>`;
 $("rb").innerHTML=o;$("rc").style.display="flex"}
function closeTab(x){
 if(due(x)>0||!lines(x).length)return;
 const c=S.cfg;x.snap=calc(x);x.no=nextNo(new Date());x.ts=new Date().toISOString();x.hd={name:c.name,addr:c.addr,nif:c.nif,foot:c.foot};x.by=SES?SES.name:"";
 S.rec.unshift(x);S.tabs=S.tabs.filter(y=>y!==x);V="tabs";save();R();show(x)}
async function exportCsv(){
 const fr=S.cfg.lang==="fr",sep=fr?";":",",q=v=>{v=String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const head=fr?["N° facture","Date","Heure","Type","Chambre/Table","Client","Articles","Total HT","Taxe touristique","TVA","Total TTC","Paiements"]:["Invoice no.","Date","Time","Type","Room/Table","Guest","Items","Total excl. VAT","Tourist tax","VAT","Total","Payments"];
 const rows=S.rec.slice().reverse().map(r=>{const d=new Date(r.ts),s=r.snap;return[r.no,d.toLocaleDateString(fr?"fr-FR":"en-GB"),d.toLocaleTimeString(fr?"fr-FR":"en-GB",{hour:"2-digit",minute:"2-digit"}),t(r.type),r.label,r.guest,s.ls.map(l=>l.q+"x "+l.n).join(" | "),s.ht,s.ls.filter(l=>l.tour).reduce((a,l)=>a+l.base,0),s.tva,s.tot,r.pays.map(p=>t(p.m)+" "+p.a).join(" | ")]});
 const txt="\ufeff"+[head].concat(rows).map(a=>a.map(q).join(sep)).join("\r\n");
 try{const dl=await claude.use("downloads");if(dl)await dl.save({filename:"ventes-"+ymd(new Date())+".csv",data:txt});else throw 0}
 catch(e){try{const u=URL.createObjectURL(new Blob([txt],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download="ventes-"+ymd(new Date())+".csv";document.body.appendChild(a);a.click();a.remove()}catch(e2){}}}
document.addEventListener("click",async e=>{
 const n=e.target.closest("nav [data-v]");if(n){ERR="";V=n.dataset.v;R();if(V==="set"&&sb)loadMem();window.scrollTo(0,0);return}
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,i=+b.dataset.i,x=tab();
 if(["addm","delm","au","pu","du","mr","mx"].includes(a)&&!(SES&&SES.role==="admin"))return;
 if(a==="nr"||a==="nb"){const id=sb?"t"+rnd():++S.seq;S.tabs.push({id,type:a==="nr"?"room":"bar",label:"",guest:"",persons:1,nights:1,rate:S.cfg.roomRate,items:[],pays:[]});CUR=id;V="tab"}
 else if(a==="open"){CUR=isNaN(+b.dataset.id)?b.dataset.id:+b.dataset.id;V="tab"}
 else if(a==="back")V="tabs";
 else if(a==="add"){const m=S.menu[i],ex=x.items.find(l=>l.n===m.n&&l.p===m.p&&l.t===m.t);ex?ex.q++:x.items.push({n:m.n,p:m.p,t:m.t,q:1})}
 else if(a==="p")x.items[i].q++;
 else if(a==="m"){if(--x.items[i].q<=0)x.items.splice(i,1)}
 else if(a==="ap"){const am=Math.min(Math.round(+$("pa").value),Math.round(due(x)));if(am>0)x.pays.push({m:$("pm").value,a:am})}
 else if(a==="rp")x.pays.splice(i,1);
 else if(a==="del"){S.tabs=S.tabs.filter(y=>y!==x);V="tabs"}
 else if(a==="close"){closeTab(x);return}
 else if(a==="rc"){show(S.rec[i]);return}
 else if(a==="exp"){exportCsv();return}
 else if(a==="addm")S.menu.push({n:t("newItem"),p:0,t:1});
 else if(a==="delm")S.menu.splice(i,1);
 else if(a==="lang")S.cfg.lang=S.cfg.lang==="fr"?"en":"fr";
 else if(a==="li"||a==="su"){ERR="";const em=$("em").value.trim(),pw=$("pw").value;if(!em||!pw)ERR="authfail";else{const r=a==="li"?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});if(r.error)ERR="authfail";else if(!r.data.session)ERR="confirm";else{BOOT=true;R();await afterAuth()}}}
 else if(a==="cc"||a==="jc"){const nm=$(a==="cc"?"un":"un2").value.trim(),v=$(a==="cc"?"cn":"jc").value.trim();if(!nm||!v)ERR="fail";else{const r=a==="cc"?await sb.rpc("create_company",{cname:v,uname:nm}):await sb.rpc("join_company",{jcode:v,uname:nm});if(r.error)ERR=a==="cc"?"fail":"badcode";else{ERR="";BOOT=true;R();await afterAuth()}}}
 else if(a==="mr"||a==="mx"){const r=a==="mr"?await sb.rpc("set_member",{uid:b.dataset.u,newrole:b.dataset.r}):await sb.rpc("remove_member",{uid:b.dataset.u});ERR=r.error?"fail":"";loadMem();return}
 else if(a==="mk"){const nm=$("un").value.trim(),p1=$("p1").value;if(!nm)ERR="reqname";else if(!/^\d{4,}$/.test(p1))ERR="pinrule";else if(p1!==$("p2").value)ERR="nomatch";else{const salt=rnd();S.users.push({id:++S.seq,name:nm,role:"admin",salt,h:await hp(salt,p1)});SES=S.users[0];V="tabs";ERR=""}}
 else if(a==="in"){const u=S.users.find(y=>y.id==$("un").value);if(u&&await hp(u.salt,$("p1").value)===u.h){SES=u;V="tabs";ERR=""}else ERR="bad"}
 else if(a==="out"){if(sb)try{await sb.auth.signOut()}catch(e){}AUTHED=false;SES=null;V="tabs";ERR="";$("rc").style.display="none"}
 else if(a==="au"){const nm=$("nu").value.trim(),pn=$("np").value;if(!nm)ERR="reqname";else if(!/^\d{4,}$/.test(pn))ERR="pinrule";else{const salt=rnd();S.users.push({id:++S.seq,name:nm,role:$("nrl").value,salt,h:await hp(salt,pn)});ERR=""}}
 else if(a==="pu"){const pn=$("pu"+i).value;if(!/^\d{4,}$/.test(pn))ERR="pinrule";else{const u=S.users[i];u.salt=rnd();u.h=await hp(u.salt,pn);ERR=""}}
 else if(a==="du"){const u=S.users[i];if(u===SES)return;if(u.role==="admin"&&S.users.filter(y=>y.role==="admin").length<2)ERR="lastadmin";else{S.users.splice(i,1);ERR=""}}
 else if(a==="cl"){$("rc").style.display="none";return}
 else if(a==="pr"){window.print();return}
 save();R()});
document.addEventListener("change",e=>{const el=e.target,d=el.dataset,x=tab();
 if((d.c!==undefined||d.mn!==undefined||d.mp!==undefined||d.mt!==undefined)&&!(SES&&SES.role==="admin"))return;
 if(d.f&&x)x[d.f]=["persons","nights","rate"].includes(d.f)?Math.max(0,+el.value||0):el.value;
 else if(d.c!==undefined)S.cfg[d.c]=NUM.includes(d.c)?(+el.value||0):el.value;
 else if(d.mn!==undefined)S.menu[d.mn].n=el.value;
 else if(d.mp!==undefined)S.menu[d.mp].p=+el.value||0;
 else if(d.mt!==undefined)S.menu[d.mt].t=+el.value;
 else return;
 save();R()});
R();
if(sb){afterAuth().catch(()=>{}).finally(()=>{BOOT=false;R()});setInterval(sync,20000);addEventListener("online",sync);document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()})}
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
